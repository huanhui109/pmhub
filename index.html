<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMHub · IT 项目管理实战课 — PMBOK 知识库与练习</title>
<meta name="description" content="面向 IT 从业者的项目管理课程式知识库：12 章实战场景 + 465 条 PMBOK 官方术语详解（配图）+ 章节测验与闪卡练习。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232563eb'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>PM</text></svg>">
<style>
:root{
  --bg:#f6f7f9;--surface:#fff;--surface2:#f0f2f5;--text:#1a2233;--text2:#5b6472;--text3:#8a93a3;
  --accent:#2563eb;--accent2:#7c3aed;--accent-soft:#e8effe;--border:#e4e7ec;
  --ok:#059669;--ok-bg:#ecfdf5;--warn:#b45309;--warn-bg:#fff7ed;--bad:#dc2626;
  --tag-pred:#eef2ff;--tag-pred-text:#4338ca;--tag-agile:#ecfdf5;--tag-agile-text:#047857;
  --tag-hybrid:#fff7ed;--tag-hybrid-text:#b45309;--tag-common:#f5f3ff;--tag-common-text:#6d28d9;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --shadow-lg:0 12px 32px rgba(16,24,40,.12);
  --radius:14px;
}
[data-theme="dark"]{
  --bg:#0e1117;--surface:#171b24;--surface2:#1f2430;--text:#e7eaf0;--text2:#a8b0be;--text3:#6f7889;
  --accent:#5b8cff;--accent2:#a78bfa;--accent-soft:#1c2740;--border:#2a3040;
  --ok:#34d399;--ok-bg:#0d3328;--warn:#fbbf24;--warn-bg:#3a2a10;--bad:#f87171;
  --tag-pred:#1e2452;--tag-pred-text:#a5b4fc;--tag-agile:#0d3328;--tag-agile-text:#6ee7b7;
  --tag-hybrid:#3a2a10;--tag-hybrid-text:#fbbf24;--tag-common:#2b2150;--tag-common-text:#c4b5fd;
  --shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 12px 32px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:background .25s,color .25s}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;cursor:pointer}
/* ---------- header ---------- */
header{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1180px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--text);white-space:nowrap}
.logo-badge{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
.nav-links{display:flex;gap:4px;margin-left:8px}
.nav-links a{color:var(--text2);font-size:14px;padding:6px 12px;border-radius:8px;transition:all .15s}
.nav-links a:hover{background:var(--surface2);color:var(--text)}
.nav-links a.active{color:var(--accent);background:var(--accent-soft);font-weight:600}
.theme-btn{margin-left:auto;border:1px solid var(--border);background:var(--surface);color:var(--text2);border-radius:9px;padding:6px 11px;font-size:15px;transition:all .2s}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}
/* ---------- layout ---------- */
.page{max-width:1180px;margin:0 auto;padding:32px 24px 90px}
.crumbs{font-size:13px;color:var(--text3);margin-bottom:18px}
.crumbs a{color:var(--text2)}
.crumbs a:hover{color:var(--accent)}
/* ---------- hero ---------- */
.hero{padding:48px 0 36px;text-align:center}
.hero .kicker{display:inline-block;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:4px 14px;border-radius:999px;margin-bottom:16px;letter-spacing:.5px}
.hero h1{font-size:clamp(28px,4.5vw,42px);font-weight:800;letter-spacing:-.5px;line-height:1.25}
.hero h1 em{font-style:normal;background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:14px auto 0;color:var(--text2);font-size:15.5px;max-width:660px}
.hero-stats{margin-top:26px;display:flex;justify-content:center;gap:36px;flex-wrap:wrap}
.hero-stat .num{font-size:26px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.hero-stat .lbl{font-size:12.5px;color:var(--text3)}
.progress-wrap{max-width:520px;margin:26px auto 0}
.progress-label{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);margin-bottom:6px}
.progress-bar{height:10px;background:var(--surface2);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s ease}
.cta-row{margin-top:26px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:11px;padding:11px 22px;font-size:14.5px;font-weight:600;border:1px solid transparent;transition:all .18s}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 14px rgba(37,99,235,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(37,99,235,.4)}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
/* ---------- section ---------- */
.section-title{display:flex;align-items:baseline;gap:10px;margin:44px 0 6px}
.section-title h2{font-size:21px;font-weight:800}
.section-title .more{margin-left:auto;font-size:13px;font-weight:500}
.section-desc{color:var(--text2);font-size:14px;margin-bottom:18px}
/* ---------- chapter cards (course) ---------- */
.chapter-list{display:flex;flex-direction:column;gap:12px}
.chapter-card{display:grid;grid-template-columns:64px 1fr auto;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 22px;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,border .18s}
.chapter-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--accent) 35%,var(--border))}
.ch-num{font-size:26px;font-weight:800;color:var(--text3);font-variant-numeric:tabular-nums;line-height:1}
.ch-card.done .ch-num{color:var(--ok)}
.ch-main h3{font-size:16.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ch-main p{font-size:13.5px;color:var(--text2);margin-top:4px}
.ch-meta{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;font-size:12px;color:var(--text3)}
.status{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 10px}
.status.todo{background:var(--surface2);color:var(--text3)}
.status.doing{background:var(--warn-bg);color:var(--warn)}
.status.done{background:var(--ok-bg);color:var(--ok)}
.ch-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.mini-btn{font-size:12.5px;font-weight:600;border-radius:9px;padding:7px 14px;border:1px solid var(--border);background:var(--surface);color:var(--text2);transition:all .15s;white-space:nowrap}
.mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.mini-btn.solid{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
/* ---------- cards (scenario knowledge) ---------- */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,border .18s;display:flex;flex-direction:column;gap:10px}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}
.card .q{font-weight:600;font-size:14.5px;line-height:1.55}
.card .a{font-size:13.5px;color:var(--text2);line-height:1.7;display:none;border-top:1px dashed var(--border);padding-top:10px}
.card.open .a{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.card .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto}
.tag{font-size:11px;border-radius:999px;padding:2px 9px;font-weight:600;white-space:nowrap}
.tag-预测型{background:var(--tag-pred);color:var(--tag-pred-text)}
.tag-敏捷{background:var(--tag-agile);color:var(--tag-agile-text)}
.tag-混合型{background:var(--tag-hybrid);color:var(--tag-hybrid-text)}
.tag-通用{background:var(--tag-common);color:var(--tag-common-text)}
.card .ref{font-size:11.5px;color:var(--text3)}
.card .hint{font-size:11px;color:var(--text3);margin-left:auto}
.card.open .hint{display:none}
mark{background:#fde68a;color:inherit;border-radius:2px;padding:0 1px}
/* ---------- chapter detail header ---------- */
.ch-hero{background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:18px;padding:30px 32px;color:#fff;margin-bottom:26px;position:relative;overflow:hidden}
.ch-hero .ch-no{font-size:13px;font-weight:700;opacity:.85;letter-spacing:1px}
.ch-hero h1{font-size:26px;font-weight:800;margin:4px 0 8px}
.ch-hero p{opacity:.92;font-size:14.5px;max-width:640px}
.ch-hero .ch-tools{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.ch-hero .btn{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3)}
.ch-hero .btn:hover{background:rgba(255,255,255,.28)}
.ch-hero .glow{position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12)}
/* ---------- term browser ---------- */
.term-tools{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.term-tools input{flex:1;min-width:220px;padding:10px 14px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;outline:none}
.term-tools input:focus{border-color:var(--accent)}
.letter-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:18px}
.letter-row button{border:1px solid var(--border);background:var(--surface);color:var(--text2);border-radius:8px;width:30px;height:30px;font-size:12.5px;font-weight:600;transition:all .12s}
.letter-row button:hover{border-color:var(--accent);color:var(--accent)}
.letter-row button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.term-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.term-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .16s,box-shadow .16s,border .16s;display:flex;gap:12px;align-items:flex-start}
.term-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}
.term-tile{flex:none;width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;color:#fff}
.term-card .t-zh{font-weight:700;font-size:14px;line-height:1.4}
.term-card .t-en{font-size:12px;color:var(--text3);margin-top:2px;word-break:break-all}
.term-card .t-def{font-size:12.5px;color:var(--text2);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* ---------- term detail ---------- */
.term-hero{border-radius:18px;overflow:hidden;border:1px solid var(--border);background:var(--surface);margin-bottom:24px}
.term-hero .art{display:block;width:100%;height:auto}
.term-hero .art svg{display:block;width:100%;height:auto}
.term-body{padding:22px 26px 26px}
.term-body .t-cat{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 12px;margin-bottom:12px}
.term-body h1{font-size:26px;font-weight:800;line-height:1.3}
.term-body .en{font-size:15px;color:var(--text3);margin-top:2px;font-weight:600}
.term-body .def{margin-top:14px;font-size:15px;line-height:1.85;color:var(--text2);background:var(--surface2);border-radius:12px;padding:16px 18px}
.term-nav{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
.term-nav a{flex:1;max-width:320px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;font-size:13px;color:var(--text2);transition:all .15s}
.term-nav a:hover{border-color:var(--accent);color:var(--accent)}
.term-nav .pn-label{font-size:11px;color:var(--text3);display:block;margin-bottom:2px}
.term-nav .next{text-align:right;margin-left:auto}
.term-section-title{font-size:17px;font-weight:800;margin:28px 0 12px}
/* ---------- quiz ---------- */
.quiz-shell{max-width:720px;margin:0 auto}
.quiz-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:28px;box-shadow:var(--shadow)}
.quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:13px;color:var(--text3)}
.quiz-q{font-size:17px;font-weight:700;line-height:1.6;margin-bottom:6px}
.quiz-sub{font-size:13.5px;color:var(--text2);margin-bottom:20px}
.opt{display:block;width:100%;text-align:left;background:var(--surface2);border:1.5px solid transparent;border-radius:12px;padding:13px 16px;font-size:14.5px;margin-bottom:10px;color:var(--text);transition:all .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default;opacity:.85}
.opt.correct{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600;opacity:1}
.opt.wrong{background:#fef2f2;border-color:var(--bad);color:var(--bad);opacity:1}
[data-theme="dark"] .opt.wrong{background:#3b1518}
.quiz-explain{display:none;background:var(--accent-soft);border-radius:12px;padding:14px 16px;font-size:13.5px;color:var(--text2);margin-top:14px;line-height:1.7}
.quiz-explain.show{display:block;animation:fadeIn .3s ease}
.quiz-actions{margin-top:22px;display:flex;justify-content:flex-end;gap:10px}
.score-big{font-size:56px;font-weight:800;text-align:center;background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.score-msg{text-align:center;color:var(--text2);margin:8px 0 22px;font-size:15px}
/* ---------- flashcards ---------- */
.flash-shell{max-width:640px;margin:0 auto}
.flash-deck{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.flash-card{perspective:1200px;height:340px;cursor:pointer;margin-bottom:20px}
.flash-inner{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flash-card.flipped .flash-inner{transform:rotateY(180deg)}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;box-shadow:var(--shadow-lg)}
.flash-front{background:var(--surface);border:1px solid var(--border)}
.flash-back{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;transform:rotateY(180deg)}
.flash-face .f-cat{font-size:12px;font-weight:700;opacity:.7;margin-bottom:10px}
.flash-face .f-zh{font-size:24px;font-weight:800;line-height:1.35}
.flash-face .f-en{font-size:14px;opacity:.75;margin-top:6px}
.flash-face .f-def{font-size:14.5px;line-height:1.8;max-height:210px;overflow:auto}
.flash-face .f-hint{position:absolute;bottom:16px;font-size:11.5px;opacity:.55}
.flash-ctrl{display:flex;justify-content:center;gap:12px}
.flash-stat{text-align:center;font-size:13px;color:var(--text3);margin-bottom:14px}
/* ---------- misc ---------- */
.empty{text-align:center;padding:70px 20px;color:var(--text3)}
.empty .big{font-size:40px;margin-bottom:10px}
footer{border-top:1px solid var(--border);padding:26px 24px;text-align:center;color:var(--text3);font-size:12.5px;line-height:1.9}
@media(max-width:760px){
  .chapter-card{grid-template-columns:1fr;gap:10px}
  .ch-num{display:none}
  .ch-actions{flex-direction:row;align-items:center}
  .nav-links{display:none}
  .quiz-card{padding:20px}
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <a class="logo" href="#/"><span class="logo-badge">PM</span>PMHub</a>
    <nav class="nav-links" id="topNav">
      <a href="#/" data-route="home">课程</a>
      <a href="#/terms" data-route="terms">术语库</a>
      <a href="#/flash" data-route="flash">闪卡练习</a>
    </nav>
    <button class="theme-btn" id="themeBtn" title="切换主题">🌙</button>
  </div>
</header>
<main class="page" id="app"></main>
<footer>

</footer>
<script type="module" src="src/main.js"></script>
</body>
</html>
